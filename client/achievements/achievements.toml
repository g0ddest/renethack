# The achievements (spec 2026-10-03-steam-achievements-design.md), read by
# nh-world::achievements. Each one:
#   id      what the game and the local store call it
#   steam   its API name on Steam (unique, ACH_...)
#   when    the condition over the host's `progress` notice; every field
#           given must hold:
#             achieved = N        NetHack's achievement N (ACH_* in you.h)
#             event = "name"      that u.uevent field is set
#             deepest = N         the deepest level reached is N or deeper
#             gameover = true     the game is over
#             ascended = true     the game ended in an ascension
#             role = "Val"        the hero's role (its file code)
#             never = "name"      that u.uconduct counter is still 0
#   icon    the medallion's subject (the achievement-icons bake): one of
#           object (an appearance), creature (a monster), role (a role's
#           hero), numeral, glyph (a pictogram of the client's icon set)
#           or emblem (one drawn for the medallions); crossed = true
#           strikes it through ("never did...")
#   hidden  Steam hides it until it is earned
#   name, desc   Fluent keys; name_en and desc_en hold the English until
#           the catalogs come


