[package]
name = "renethack-gd"
description = "renethack: the Godot client (GDExtension)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Steam's achievements (`make steam`): links Valve's steam_api library
steam = ["dep:steamworks"]

[dependencies]
godot.workspace = true
nh-protocol = { path = "../nh-protocol" }
nh-link = { path = "../nh-link" }
nh-world = { path = "../nh-world" }
nh-art = { path = "../nh-art" }
steamworks = { version = "0.13", optional = true }
# the client's own words in the player's language (Project Fluent)
fluent-bundle = "0.16"
unic-langid = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# the catalogs' keys and arguments, read in the tests
fluent-syntax = "0.12"
