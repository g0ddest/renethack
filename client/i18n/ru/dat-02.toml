# R6, dat texts, part 2: the Oracle's major consultations (dat/oracles.txt).

[f24576c93c6b]
en = "If thy wand hath run out of charges, thou mayst zap it again and again; though\nnaught will happen at first, verily, thy persistence shall be rewarded, as\none last charge may yet be wrested from it!"
ru = "Коли иссякли заряды твоей палочки, взмахивай ею снова и снова: поначалу\nничего не случится, но воистину упорство твоё будет вознаграждено, ибо\nпоследний заряд ещё можно из неё исторгнуть!"

[84749e351cde]
en = "Though the shopkeepers be wary, thieves have nevertheless stolen much by using\ntheir digging wands to hasten exits through the pavement."
ru = "Хоть лавочники и осторожны, воры немало у них похитили, прорывая себе\nпалочками копания поспешный выход сквозь пол."

[23ff1de237ae]
en = "If thou hast had trouble with rust on thine armor or weapons, thou shouldst\nknow that thou canst prevent this by, while in a confused state, reading the\nmagical parchments which normally are used to cause their enchantment.\nUnguents of lubrication may provide similar protection, albeit of a\ntransitory nature."
ru = "Коли досаждает тебе ржа на доспехах и оружии, знай: уберечь их можно,\nпрочтя в смятении ума те волшебные пергаменты, коими обыкновенно их\nзачаровывают. Смазочные снадобья дают подобную защиту, хотя и\nнедолговечную."

[1780f93e1704]
en = "Behold the cockatrice, whose diminutive stature belies its hidden might.  The\ncockatrice can petrify any ordinary being it contacts--save those wise\nadventurers who eat a dead lizard or blob of acid when they feel themselves\nslowly turning to stone."
ru = "Узри василиска, чей малый рост скрывает великую силу. Василиск обращает в\nкамень всякое обычное существо, коего коснётся, — кроме мудрых искателей\nприключений, что съедают мёртвую ящерицу или кислотный сгусток, ощутив,\nкак медленно каменеют."

[8ecf7cfadd32]
en = "While some wayfarers rely on scrounging finished armour in the dungeon, the\nresourceful know the mystical means by which mail may be fashioned out of\nscales from a dragon's hide."
ru = "Иные странники надеются отыскать в подземелье готовые доспехи, но\nнаходчивым ведомо таинство, коим кольчугу можно сработать из чешуи, снятой\nсо шкуры дракона."

[d3641cc79f65]
en = "It is customarily known among travelers that extra-healing draughts may clear\nthy senses when thou art addled by delusory visions.  But never forget, the\nlowly potion which makes one sick may be used for the same purpose."
ru = "Среди странников известно, что снадобья сильного исцеления проясняют\nразум, смущённый обманными видениями. Но не забывай: и низкое зелье, от\nкоего делается дурно, может послужить той же цели."

[4bc607e6daa3]
en = "While the consumption of lizard flesh or water beloved of the gods may clear\nthe muddled head, the application of the horn of a creature of utmost purity\ncan alleviate many other afflictions as well."
ru = "Мясо ящерицы или вода, любезная богам, проясняют затуманенную голову, но\nрог существа наивысшей чистоты избавляет и от многих иных напастей."

[35348936ce98]
en = "If thou wouldst travel quickly between distant locations, thou must be\nable to control thy teleports, and in a confused state misread the scroll\nwhich usually teleports thyself locally.  Daring adventurers have also\nperformed the same feat sans need for scrolls or potions by stepping into\na particular ambuscade."
ru = "Коли желаешь ты быстро перемещаться между далёкими местами, должно тебе\nвладеть своими телепортациями и в смятении ума прочесть не так свиток, что\nобыкновенно переносит тебя неподалёку. Отважные искатели приключений\nсовершали то же и без свитков и зелий, ступив в особую западню."

[bdb8bf14714f]
en = "Almost all adventurers who come this way hope to pass the dread Medusa.  To\ndo this, the best advice is to keep thine eyes blindfolded and to cause the\ncreature to espy its own reflection in a mirror."
ru = "Почти все искатели приключений, что идут этим путём, надеются миновать\nгрозную Медузу. Лучший совет здесь — держать глаза завязанными и заставить\nчудовище узреть своё отражение в зеркале."

[b0fe962ce4ed]
en = "And where it is written \"ad aerarium\", diligent searching will often reveal\nthe way to a trap which sends one to the Magic Memory Vault, where the riches\nof Croesus are stored; however, escaping from the vault with its gold is much\nharder than getting in."
ru = "А где начертано «ad aerarium», усердные поиски нередко открывают путь к\nзападне, что переносит в Волшебное хранилище памяти, где сокрыты богатства\nКрёза; однако выбраться из хранилища с его золотом куда труднее, чем туда\nпопасть."

[cd7a2c0158db]
en = "It is well known that wily shopkeepers raise their prices whene'er they\nespy the garish apparel of the approaching tourist or the countenance of a\ndisfavored patron.  They favor the gentle of manner and the fair of face.\nThe boor may expect unprofitable transactions."
ru = "Всем известно, что хитрые лавочники поднимают цены, завидев пёстрое платье\nприближающегося туриста или лик немилого им покупателя. Любы им кроткие\nнравом и пригожие лицом. Грубияну же не видать выгодных сделок."

[632c382d6538]
en = "The cliche of the kitchen sink swallowing any unfortunate rings that contact\nits pernicious surface reflecteth greater truth than many homilies, yet\neven so, few have developed the skill to identify enchanted rings by the\ntransfigurations effected upon the voracious device's frame."
ru = "Избитая присказка о кухонной раковине, что глотает всякое несчастное\nкольцо, коснувшееся её пагубной поверхности, правдивее многих поучений; и\nвсё же немногие овладели искусством распознавать зачарованные кольца по\nпеременам, что они творят с обликом прожорливого устройства."

[4bb4e2079f01]
en = "The meat of enchanted creatures ofttimes conveyeth magical properties\nunto the consumer.  A fresh corpse of floating eye doth fetch a high\nprice among wizards for its utility in conferring Telepathy, by which\nthe sightless may locate surrounding minds."
ru = "Мясо волшебных созданий нередко передаёт едоку их магические свойства.\nСвежий труп парящего ока высоко ценится у волшебников, ибо дарует\nТелепатию, коей незрячий может находить окружающие его умы."

[cdd47c994974]
en = "The detection of blessings and curses is in the domain of the gods.  They will\nmake this information available to mortals who request it at their places of\nworship, or elsewhere for those mortals who devote themselves to the service\nof the gods."
ru = "Распознавать благословения и проклятия — удел богов. Они открывают это\nсмертным, что просят о том в местах поклонения, а также в иных местах —\nтем смертным, что посвятили себя служению богам."

[6b4be1c8c413]
en = "At times, the gods may favor worthy supplicants with named blades whose\npowers echo throughout legend.  Learned wayfarers can reproduce blades of\nelven lineage, hated of the orcs, without the need for such intervention."
ru = "Порой боги жалуют достойных просителей именными клинками, чья сила гремит\nв легендах. Сведущие же странники умеют воссоздавать клинки эльфийского\nрода, ненавистные оркам, и без подобного заступничества."

[186b8f7db8c8]
en = "There are many stories of a mighty amulet, the origins of which are said\nto be ancient Yendor.  This amulet doth have awesome power, and the gods\ndesire it greatly.  Mortals mayst tap only portions of its terrible\nabilities.  The stories tell of mortals seeing what their eyes cannot\nsee and seeking places of magical transportation, while having this\namulet in their possession.  Others say a mortal must wear the amulet to\nobtain these powers.  But verily, such power comes at great cost, to\npreserve the balance."
ru = "Много сказаний ходит о могучем амулете, чьи истоки, говорят, восходят к\nдревнему Йендору. Велика мощь сего амулета, и боги страстно его жаждут.\nСмертным же доступна лишь малая доля его грозных сил. Сказания говорят,\nчто смертные, владея им, видели незримое глазу и искали места волшебного\nперемещения. Иные же молвят, что для этих сил амулет надлежит носить. Но\nвоистину, такая мощь даётся дорогой ценой, дабы сохранить равновесие."

[23b0d3294b0d]
en = "It is said that thou mayst gain entry to Moloch's sanctuary, if thou\ndarest, from a place where the ground vibrateth in the deepest depths of\nGehennom.  Thou needs must have the aid of three magical items.  The\npure sound of a silver bell shall announce thee.  The terrible runes,\nread from Moloch's book, shall cause the earth to tremble mightily.  The\nlight of an enchanted candelabrum shall show thee the way."
ru = "Говорят, что в святилище Молоха можно войти, коли посмеешь, из места, где\nземля дрожит в глубочайших недрах Геенны. Понадобится тебе помощь трёх\nволшебных предметов. Чистый звук серебряного колокола возвестит о тебе.\nГрозные руны, прочтённые из книги Молоха, заставят землю содрогнуться.\nСвет зачарованного канделябра укажет тебе путь."
not_terms = ["bell"]

[c8dd91efac17]
en = "In the deepest recesses of the Dungeons of Doom, guarding access to the\nnether regions, there standeth a castle, wherein lieth a wand of wishes.\nIf thou wouldst gain entry, bear with thee an instrument of music, for the\npontlevis may be charmed down with the proper melody.  What notes comprise\nit only the gods know, but a musical mastermind may yet succeed by witful\nimprovisation.  However, the less perspicacious are not without recourse,\nshould they be prepared to circumambulate the castle to the postern."
ru = "В глубочайших недрах Подземелий Рока, охраняя путь в преисподнюю, стоит\nзамок, а в нём лежит палочка желаний. Коли желаешь войти, принеси с собою\nмузыкальный инструмент, ибо подъёмный мост можно опустить нужной мелодией.\nИз каких нот она сложена, ведают лишь боги, но музыкальный гений может\nпреуспеть, искусно импровизируя. Впрочем, и менее проницательные не\nостанутся без выхода, коли готовы обойти замок кругом к задним воротам."

[a5e1c035b1de]
en = "The gods are said to be pleased when offerings are given to the\npriests who attend their temples, and they may grant various favors to\nthose who do so.  But beware!  To be young and frugal is better than to\nbe old and miserly."
ru = "Говорят, боги довольны, когда подношения отдают жрецам, служащим в их\nхрамах, и даруют таким людям разные милости. Но берегись! Лучше быть\nмолодым и бережливым, чем старым и скупым."

[eda01d5f4659]
en = "The name of Elbereth may strike fear into the hearts of thine enemies, if\nthou dost write it upon the ground at thy feet.  If thou maintainest the\nutmost calm, thy safety will be aided greatly, but beware lest thy clumsy\nfeet scuff the inscription, cancelling its potence, or thy wayward\nsword-arm break the truce."
ru = "Имя Elbereth может вселить страх в сердца твоих врагов, коли начертаешь\nего на земле у себя под ногами. Коли сохранишь величайшее спокойствие, это\nвесьма поможет тебе уцелеть, но берегись, как бы неуклюжие ноги не стёрли\nнадпись, лишив её силы, или своенравная рука с мечом не нарушила\nперемирие."
