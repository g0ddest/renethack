# R6, dat texts: the false rumours (dat/rumors.fal), as fortune cookies,
# the Oracle's minor consultations and the rest tell them; "[cookie] " is
# the engine's own marker, cut before a rumour is shown. Syntax: nh-i18n's
# template.rs; not_terms: English words that are not the glossary's terms
# there.

[2b22b6fbebf2]
en = "1st Law of Hacking:  leaving is much more difficult than entering."
ru = "Первый закон хакинга: выйти гораздо труднее, чем войти."

[f49b5e8dd59a]
en = "2nd Law of Hacking:  first in, first out."
ru = "Второй закон хакинга: первым вошёл — первым вышел."

[7d699b2c504a]
en = "3rd Law of Hacking:  the last blow counts most."
ru = "Третий закон хакинга: важнее всего последний удар."

[3205480d6378]
en = "4th Law of Hacking:  you will find the exit at the entrance."
ru = "Четвёртый закон хакинга: выход вы найдёте у входа."

[205ee04aa6d8]
en = "A chameleon imitating a mail daemon often delivers scrolls of fire."
ru = "Хамелеон, изображающий почтового демона, часто приносит свитки огня."

[1213474502ee]
en = "A cockatrice corpse is guaranteed to be untainted!"
ru = "Труп василиска гарантированно свежий!"

[aed83d8abdc9]
en = "A dead cockatrice is just a dead lizard."
ru = "Мёртвый василиск — просто мёртвая ящерица."

[02d496ac00b0]
en = "A dragon is just a snake that ate a scroll of fire."
ru = "Дракон — это просто змея, которая съела свиток огня."

[ab23f8bf0e0f]
en = "A fading corridor enlightens your insight."
ru = "Исчезающий коридор проясняет разум."

[66cbb49b950b]
en = "A glowing potion is too hot to drink."
ru = "Светящееся зелье слишком горячее, чтобы его пить."

[40e7ad55c1e9]
en = "A good amulet may protect you against guards."
ru = "Хороший амулет защитит вас от стражей."

[5227bfacaa1f]
en = "A lizard corpse is a good thing to turn undead."
ru = "Трупом ящерицы удобно изгонять нежить."

[908f3e72d0ce]
en = "A long worm can be defined recursively.  So how should you attack it?"
ru = "Длинного червя можно определить рекурсивно.  Так как же его атаковать?"

[063fe67d95ef]
en = "A nymph will be very pleased if you call her by her real name:  Lorelei."
ru = "Нимфа будет очень рада, если вы назовёте её настоящим именем: Лорелея."

[f34875e826e7]
en = "A ring of dungeon master control is a great find."
ru = "Кольцо управления мастером подземелья — отличная находка."

[05d2848e69d7]
en = "A ring of extra ring finger is useless if not enchanted."
ru = "Кольцо лишнего безымянного пальца бесполезно без зачарования."

[19c0c7b61b24]
en = "A rope may form a trail in a maze."
ru = "Верёвка поможет отметить путь в лабиринте."

[d5642bb7debd]
en = "A staff may recharge if you drop it for awhile."
ru = "Посох может перезарядиться, если его ненадолго бросить."

[fd182dbaba40]
en = "A visit to the Zoo is very educational; you meet interesting animals."
ru = "Поход в зверинец очень познавателен: там встречаются интересные животные."

[01e14ec8f251]
en = "A wand of deaf is a more dangerous weapon than a wand of sheep."
ru = "Палочка смерди — оружие опаснее, чем палочка сена."

[c9213c868530]
en = "A wand of vibration might bring the whole cave crashing about your ears."
ru = "Палочка вибрации может обрушить вам на голову всю пещеру."

[fb49bf6b1351]
en = "A winner never quits.  A quitter never wins."
ru = "Победитель никогда не сдаётся.  Сдавшийся никогда не побеждает."

[88dffd9dc546]
en = "[cookie] A wish?  Okay, make me a fortune cookie!"
ru = "Желание?  Ладно, сделайте из меня печенье с предсказанием!"

[c97f17a81e41]
en = "Afraid of mimics?  Try to wear a ring of true seeing."
ru = "Боитесь мимиков?  Попробуйте надеть кольцо истинного зрения."

[97e1e9c7896c]
en = "All monsters are created evil, but some are more evil than others."
ru = "Все монстры созданы злыми, но некоторые злее других."

[b354491ec5f7]
en = "Always attack a floating eye from behind!"
ru = "Парящее око всегда атакуйте со спины!"

[1c92f317babe]
en = "An elven cloak is always the height of fashion."
ru = "Эльфийский плащ всегда на пике моды."

[c4ff43dd08c0]
en = "Any small object that is accidentally dropped will hide under a larger object."
ru = "Любой мелкий предмет, случайно оброненный, спрячется под предметом покрупнее."

[65c26701dc91]
en = "Archeologists are very squishy, often found under boulders."
ru = "Археологи очень мягкие, их часто находят под валунами."

[26c7173a1611]
en = "Archeologists find more bones piles."
ru = "Археологи находят больше куч костей."

[7ef017e97684]
en = "Austin Powers says: My Mojo is back!  Yeah, baby!"
ru = "Остин Пауэрс говорит: моё моджо снова со мной!  Йе, бейби!"

[d599abbe19da]
en = "Balrogs do not appear above level 20."
ru = "Балроги не встречаются выше 20-го уровня."

[06dd8fe124d3]
en = "Banana peels work especially well against Keystone Kops."
ru = "Банановая кожура особенно хорошо действует на кистоунских копов."

[5017089c2847]
en = "Be careful when eating bananas.  Monsters might slip on the peels."
ru = "Осторожнее с бананами.  Монстры могут поскользнуться на кожуре."

[67d2c4c715da]
en = "Better leave the dungeon; otherwise you might get hurt badly."
ru = "Лучше покиньте подземелье, а то можете сильно пострадать."

[2a20eb1cbb85]
en = "Beware of the potion of nitroglycerin -- it's not for the weak of heart."
ru = "Берегитесь зелья нитроглицерина — оно не для слабых сердцем."

[19c2760deba2]
en = "Beware:  there's always a chance that your wand explodes as you try to zap it!"
ru = "Осторожно: палочка всегда может взорваться, когда вы ею взмахнёте!"

[89f615cf87b0]
en = "Beyond the 23rd level lies a happy retirement in a room of your own."
ru = "За 23-м уровнем вас ждёт счастливая пенсия в отдельной комнате."

[0943168bd087]
en = "Changing your suit without dropping your sword?  You must be kidding!"
ru = "Переодеться, не выпуская меча?  Вы шутите!"

[e1bc4972351c]
en = "Close the door!  You're letting the heat out!"
ru = "Закройте дверь!  Тепло уходит!"

[c471671debb9]
en = "Cockatrices might turn themselves to stone faced with a mirror."
ru = "Василиски могут окаменеть, увидев себя в зеркале."

[bb5e5e3e4eb3]
en = "Consumption of home-made food is strictly forbidden in this dungeon."
ru = "Употребление домашней еды в этом подземелье строго запрещено."

[3fe277d1b011]
en = "Dark room?  Your chance to develop your photographs!"
ru = "Тёмная комната?  Самое время проявить фотографии!"

[54148a192ced]
en = "Dark rooms are not *completely* dark:  just wait and let your eyes adjust..."
ru = "Тёмные комнаты темны не *совсем*: подождите, пока глаза привыкнут..."

[1e15fe2683a2]
en = "David London sez, \"Hey guys, *WIELD* a lizard corpse against a cockatrice!\""
ru = "Дэвид Лондон грит: \"Ребята, *ВОЗЬМИТЕ В РУКИ* труп ящерицы против василиска!\""

[b5c9791f991f]
en = "Death is just life's way of telling you you've been fired."
ru = "Смерть — это просто способ, которым жизнь сообщает, что вы уволены."

[dae749be30f3]
en = "Demi-gods don't need any help from the gods."
ru = "Полубогам помощь богов не нужна."

[5af8f27cc8fa]
en = "Demons *HATE* Priests and Priestesses."
ru = "Демоны *НЕНАВИДЯТ* жрецов и жриц."

[196c5895eae1]
en = "Didn't you forget to pay?"
ru = "Вы не забыли заплатить?"

[23103ef89b85]
en = "Didn't your mother tell you not to eat food off the floor?"
ru = "Разве мама не говорила вам не есть с пола?"

[8c6b1967ca86]
en = "Direct a direct hit on your direct opponent, directing in the right direction."
ru = "Направьте прямой удар на прямого противника, направляя в правильном направлении."

[55b24868eeec]
en = "Do you want to make more money?  Sure, we all do!  Join the Fort Ludios guard!"
ru = "Хотите больше зарабатывать?  Конечно, все хотят!  Вступайте в стражу Форта Лудиос!"

[ba673eb3268c]
en = "Does your boss know what you're doing right now?"
ru = "А ваш начальник знает, чем вы сейчас занимаетесь?"

[1d122dcb0490]
en = "Don't bother wishing for things.  You'll probably find one on the next level."
ru = "Не тратьте желания.  Скорее всего, то же самое найдётся на следующем уровне."

[a37f29d91892]
en = "Don't eat too much:  you might start hiccoughing!"
ru = "Не объедайтесь: начнёте икать!"

[507dfe4e8c3b]
en = "Don't play NetHack at your work; your boss might hit you!"
ru = "Не играйте в NetHack на работе: начальник может вас ударить!"

[b1786a4dfdf1]
en = "Don't tell a soul you found a secret door, otherwise it isn't a secret anymore."
ru = "Никому не говорите, что нашли потайную дверь, иначе она перестанет быть тайной."

[faa624a8a04a]
en = "Drinking potions of booze may land you in jail if you are under 21."
ru = "Распитие флаконов выпивки до 21 года может привести вас за решётку."

[d1cd49081a7f]
en = "Drop your vanity and get rid of your jewels!  Pickpockets about!"
ru = "Оставьте тщеславие и избавьтесь от драгоценностей!  Кругом карманники!"

[0458cbe69dce]
en = "Eat 10 cloves of garlic and keep all humans at a two-square distance."
ru = "Съешьте 10 зубчиков чеснока, и все люди будут держаться от вас за две клетки."

[674e3272358e]
en = "Eels hide under mud.  Use a unicorn to clear the water and make them visible."
ru = "Угри прячутся в иле.  Чтобы очистить воду и увидеть их, позовите единорога."

[a98909226ea1]
en = "Eels will help you tie your shoes."
ru = "Угри помогут вам завязать шнурки."

[9df65a93b09b]
en = "Elf has extra speed."
ru = "У эльфа повышенная скорость."

[e7156f05915f]
en = "Engrave your wishes with a wand of wishing."
ru = "Записывайте свои желания палочкой желаний."

[17e474471a45]
en = "Eventually you will come to admire the swift elegance of a retreating nymph."
ru = "Со временем вы оцените стремительное изящество убегающей нимфы."

[0b6f909f4930]
en = "Ever heard hissing outside?  I *knew* you hadn't!"
ru = "Слышали когда-нибудь шипение снаружи?  Я *так* и знал, что нет!"

[36e559d1953f]
en = "Ever lifted a dragon corpse?"
ru = "Вы когда-нибудь поднимали труп дракона?"

[252e1bedea34]
en = "Ever seen a leocrotta dancing the tengu?"
ru = "Видели когда-нибудь, как левкрота пляшет тэнгу?"

[65577d1cdc05]
en = "Ever seen your weapon glow plaid?"
ru = "Видели, как ваше оружие светится в клеточку?"

[1249276973d2]
en = "Ever tamed a shopkeeper?"
ru = "Приручали когда-нибудь лавочника?"

[ad675df522a8]
en = "Ever tried digging through a Vault Guard?"
ru = "Пробовали прокопаться сквозь стража хранилища?"

[d7d6b7629834]
en = "Ever tried enchanting a rope?"
ru = "Пробовали зачаровать верёвку?"

[e1cab72d7af0]
en = "Floating eyes can't stand Hawaiian shirts."
ru = "Парящие очи не выносят гавайских рубашек."

[528df914b3fa]
en = "For any remedy there is a misery."
ru = "На любое лекарство найдётся своя хворь."

[3a6b4ead3b82]
en = "Giant bats turn into giant vampires."
ru = "Гигантские летучие мыши превращаются в гигантских вампиров."
not_terms = ["giant"]

[18917603445e]
en = "Good day for overcoming obstacles.  Try a steeplechase."
ru = "Хороший день для преодоления препятствий.  Попробуйте стипль-чез."

[330cb0e33c33]
en = "Half Moon tonight.  (At least it's better than no Moon at all.)"
ru = "Сегодня половина луны.  (Всё лучше, чем совсем без луны.)"

[51a6616d0b56]
en = "[cookie] Help!  I'm being held prisoner in a fortune cookie factory!"
ru = "Помогите!  Я узник фабрики печенья с предсказанием!"

[5be4aea537a7]
en = "Housecats have nine lives, kittens only one."
ru = "У домашних кошек девять жизней, а у котят — только одна."

[7413e83d57d5]
en = "How long can you tread water?"
ru = "Долго вы продержитесь на плаву?"

[6447c2c59df8]
en = "Hungry?  There is an abundance of food on the next level."
ru = "Проголодались?  На следующем уровне еды навалом."

[611d6a824b55]
en = "I guess you've never hit a mail daemon with the Amulet of Yendor..."
ru = "Наверное, вы ещё ни разу не били почтового демона Амулетом Йендора..."

[7bbc57bd711e]
en = "If there's a spot of blood on your hands, why not wash them?"
ru = "Если на руках пятно крови, почему бы их не вымыть?"

[3cd47db75545]
en = "If you are the shopkeeper, you can take things for free."
ru = "Если вы — лавочник, можете брать вещи бесплатно."

[fe60878e84b4]
en = "If you ask really nicely, the Wizard will give you the Amulet."
ru = "Если очень вежливо попросить, Волшебник отдаст вам Амулет."

[3ed909150793]
en = "If you can't learn to do it well, learn to enjoy doing it badly."
ru = "Если не можете научиться делать это хорошо, научитесь получать удовольствие, делая это плохо."

[3d39218d07e6]
en = "If you thought the Wizard was bad, just wait till you meet the Warlord!"
ru = "Если вам казалось, что Волшебник плох, подождите, пока встретите Военачальника!"

[f34f075e6d34]
en = "If you turn blind, don't expect your dog to be turned into a seeing-eye dog."
ru = "Если ослепнете, не ждите, что ваша собака станет собакой-поводырём."

[cdea6b8ee1e3]
en = "If you want to feel great, you must eat something real big."
ru = "Хотите почувствовать себя великим — съешьте что-нибудь по-настоящему большое."

[87304e5b30ce]
en = "If you want to float, you'd better eat a floating eye."
ru = "Хотите парить — съешьте парящее око."

[80f1d01b268e]
en = "If your ghost kills a player, it increases your score."
ru = "Если ваше привидение убьёт игрока, ваш счёт вырастет."

[96376c0ccf06]
en = "Increase mindpower:  Tame your own ghost!"
ru = "Развивайте силу разума: приручите собственное привидение!"

[bad8f5aed355]
en = "It furthers one to see the great man."
ru = "Полезно повидать великого человека."

[26d8d301870a]
en = "It's easy to overlook a monster in a wood."
ru = "Монстра в лесу легко не заметить."

[52c970cb88af]
en = "Just below any trap door there may be another one.  Just keep falling!"
ru = "Прямо под любым люком может оказаться ещё один.  Падайте дальше!"

[6a724e1f7587]
en = "Katanas are very sharp; watch you don't cut yourself."
ru = "Катаны очень острые: смотрите не порежьтесь."

[6daa93007172]
en = "Keep a clear mind:  quaff clear potions."
ru = "Сохраняйте ясность ума: пейте прозрачные зелья."

[6d1851f7844a]
en = "Kicking the terminal doesn't hurt the monsters."
ru = "Пинать терминал бесполезно: монстрам от этого не больно."

[b20353abf8d1]
en = "Killer bees keep appearing till you kill their queen."
ru = "Пчёлы-убийцы будут появляться, пока вы не убьёте их матку."

[54625e25c02a]
en = "Killer bunnies can be tamed with carrots only."
ru = "Кроликов-убийц можно приручить только морковью."

[e2fc1607e671]
en = "Latest news?  Put `rec.games.roguelike.nethack' in your .newsrc!"
ru = "Свежие новости?  Добавьте `rec.games.roguelike.nethack' в свой .newsrc!"

[0c6551bab845]
en = "Learn how to spell.  Play NetHack!"
ru = "Хотите научиться грамотно колдовать?  Играйте в NetHack!"

[64c2f9f65912]
en = "Leprechauns hide their gold in a secret room."
ru = "Лепреконы прячут золото в тайной комнате."

[810d1ef8dec6]
en = "Let your fingers do the walking on the yulkjhnb keys."
ru = "Пусть ваши пальцы прогуляются по клавишам yulkjhnb."

[49a4f568cf41]
en = "Let's face it:  this time you're not going to win."
ru = "Посмотрим правде в глаза: на этот раз вы не победите."

[cd5a261712da]
en = "Let's have a party, drink a lot of booze."
ru = "Давайте устроим вечеринку и напьёмся!"

[177ab7b59172]
en = "Liquor sellers do not drink; they hate to see you twice."
ru = "Торговцы выпивкой не пьют: им противно видеть вас дважды."

[6d8035c28092]
en = "Lunar eclipse tonight.  May as well quit now!"
ru = "Сегодня лунное затмение.  Можно сразу сдаваться!"

[c8bbcc651148]
en = "Meeting your own ghost decreases your luck considerably!"
ru = "Встреча с собственным привидением сильно уменьшает удачу!"

[0209bde3424e]
en = "Money to invest?  Take it to the local branch of the Magic Memory Vault!"
ru = "Есть деньги для вложений?  Несите их в местное отделение «Волшебного Хранилища Памяти»!"

[41d6deeca51f]
en = "Monsters come from nowhere to hit you everywhere."
ru = "Монстры приходят ниоткуда, чтобы бить вас повсюду."

[d3cf977d678f]
en = "Monsters sleep because you are boring, not because they ever get tired."
ru = "Монстры спят не от усталости, а потому что с вами скучно."

[c649e5ff830e]
en = "Most monsters prefer minced meat.  That's why they are hitting you!"
ru = "Большинство монстров предпочитает фарш.  Вот почему они вас бьют!"

[c60a4ca6e876]
en = "Most of the bugs in NetHack are on the floor."
ru = "Большинство багов в NetHack ползает по полу."

[a65f559dc4b9]
en = "Much ado Nothing Happens."
ru = "Много шума из «Ничего не происходит»."

[8988477b471c]
en = "Multi-player NetHack is a myth."
ru = "Многопользовательский NetHack — это миф."

[11edddaf1ba2]
en = "NetHack is addictive.  Too late, you're already hooked."
ru = "NetHack вызывает привыкание.  Поздно, вы уже на крючке."

[3895ff902c60]
en = "Never ask a shopkeeper for a price list."
ru = "Никогда не просите у лавочника прейскурант."

[08b58986ebeb]
en = "Never burn a tree, unless you like getting whacked with a +5 shovel."
ru = "Никогда не жгите деревья, если не любите получать по голове лопатой +5."

[b408a66c9a02]
en = "Never eat with glowing hands!"
ru = "Никогда не ешьте светящимися руками!"

[f1a4485571f6]
en = "Never mind the monsters hitting you:  they just replace the charwomen."
ru = "Не обращайте внимания на бьющих вас монстров: они просто заменяют уборщиц."

[254f8fbb5911]
en = "Never play leapfrog with a unicorn."
ru = "Никогда не играйте с единорогом в чехарду."

[8cb620c1143b]
en = "Never step on a cursed engraving."
ru = "Никогда не наступайте на проклятую надпись."

[1bce851f5a97]
en = "Never swim with a camera:  there's nothing to take pictures of."
ru = "Никогда не плавайте с фотоаппаратом: снимать там нечего."

[d8d55ef58edb]
en = "Never teach your pet rust monster to fetch."
ru = "Никогда не учите ручного ржавника приносить палку."

[60a23a85a63f]
en = "Never trust a random generator in magic fields."
ru = "Никогда не доверяйте генератору случайностей в магических полях."

[a89579ce55c8]
en = "Never use a wand of death."
ru = "Никогда не пользуйтесь палочкой смерти."

[b63e40dc69c9]
