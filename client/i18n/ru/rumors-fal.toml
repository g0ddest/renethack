[bfac79a371cc]
en = "They say that good things come to those that wait."
ru = "Говорят, всё приходит к тому, кто умеет ждать."

[a5f692f042e1]
en = "They say that if you can't spell then you'll wish you had a spellbook."
ru = "Говорят, кто не силён в заклинаниях, мечтает о книге заклинаний."

[c78ca47c6c6d]
en = "They say that if you live by the sword, you'll die by the sword."
ru = "Говорят, кто с мечом живёт, от меча и погибнет."

[e7f5aa212999]
en = "They say that if you play like a monster you'll have a better game."
ru = "Говорят, если играть как монстр, игра пойдёт лучше."

[f92359280691]
en = "They say that if you sleep with a demon you might awake with a headache."
ru = "Говорят, если переспать с демоном, можно проснуться с головной болью."

[3cad1ec0d306]
en = "They say that if you step on a crack you could break your mother's back."
ru = "Говорят, наступишь на трещину — сломаешь маме спину."

[c430f8c59f0b]
en = "They say that if you're invisible you can still be heard!"
ru = "Говорят, невидимку всё равно слышно!"

[d352ce60f6b9]
en = "They say that if you're lucky you can feel the runes on a scroll."
ru = "Говорят, если повезёт, руны на свитке можно нащупать."

[966804d456dd]
en = "They say that in the big picture gold is only small change."
ru = "Говорят, в масштабах целого золото — всего лишь мелочь."

[07d568c02d4c]
en = "They say that in the dungeon it's not what you know that really matters."
ru = "Говорят, в подземелье важно не то, что вы знаете."

[155800913210]
en = "They say that in the dungeon moon rocks are really dilithium crystals."
ru = "Говорят, в подземелье лунные камни на самом деле — кристаллы дилития."

[9fb7fed83337]
en = "They say that in the dungeon the boorish customer is never right."
ru = "Говорят, в подземелье грубый покупатель никогда не прав."

[6979dd7d7e9c]
en = "They say that in the dungeon you don't need a watch to tell time."
ru = "Говорят, в подземелье часы, чтобы узнать время, не нужны."

[dd168476f770]
en = "They say that in the dungeon you need something old, new, burrowed and blue."
ru = "Говорят, в подземелье нужно что-то старое, что-то новое, что-то закопанное и что-то голубое."

[c9978bcb6fc8]
en = "They say that in the dungeon you should always count your blessings."
ru = "Говорят, в подземелье всегда стоит пересчитывать свои благословения."

[18c4544605b2]
en = "They say that iron golem plate mail isn't worth wishing for."
ru = "Говорят, латный доспех из железного голема не стоит желания."

[82b424bb3fbe]
en = "They say that it takes four quarterstaffs to make one staff."
ru = "Говорят, из четырёх боевых посохов, они же четвертные, выходит один целый."

[ec006ac7ba25]
en = "They say that it's not over till the fat ladies sing."
ru = "Говорят, всё не кончено, пока не запоют толстые дамы."

[4dc6601ea34e]
en = "They say that it's not over till the fat lady shouts `Off with its head'."
ru = "Говорят, всё не кончено, пока толстая дама не крикнет `Отрубить ему голову!'."
not_terms = ["lady"]

[4fb67f45ce7f]
en = "They say that kicking a heavy statue is really a dumb move."
ru = "Говорят, пинать тяжёлую статую — очень глупый ход."

[7b92a9a8214c]
en = "They say that kicking a valuable gem doesn't seem to make sense."
ru = "Говорят, пинать драгоценный камень — смысла никакого."

[26caff251ed3]
en = "They say that leprechauns know Latin and you should too."
ru = "Говорят, лепреконы знают латынь, и вам бы не помешало."

[fd938ebb15e8]
en = "They say that minotaurs get lost outside of the mazes."
ru = "Говорят, минотавры теряются вне лабиринтов."

[3cbaadcc0055]
en = "They say that most trolls are born again."
ru = "Говорят, большинство троллей рождаются заново."

[e2833bd56d3f]
en = "They say that naming your cat Garfield will make you more attractive."
ru = "Говорят, если назвать кота Гарфилдом, вы станете привлекательнее."

[fb7458d64a3d]
en = "They say that no one knows everything about everything in the dungeon."
ru = "Говорят, никто не знает всего обо всём в подземелье."

[8977327dba37]
en = "They say that no one plays NetHack just for the fun of it."
ru = "Говорят, никто не играет в NetHack просто ради удовольствия."

[e6b63af6c5af]
en = "They say that no one really subscribes to rec.games.roguelike.nethack."
ru = "Говорят, на rec.games.roguelike.nethack на самом деле никто не подписан."

[78bcd0a2bdab]
en = "They say that no one will admit to starting a rumor."
ru = "Говорят, никто не признается, что пустил слух."

[7308531c0605]
en = "They say that nurses sometimes carry scalpels and never use them."
ru = "Говорят, медсёстры иногда носят скальпели, но никогда ими не пользуются."

[c71e4a6bf206]
en = "They say that once you've met one wizard you've met them all."
ru = "Говорят, кто видел одного волшебника, видел их всех."

[c739cab29c83]
en = "They say that one troll is worth 10,000 newts."
ru = "Говорят, один тролль стоит 10 000 тритонов."

[2537f23b868c]
en = "They say that only David can find the zoo!"
ru = "Говорят, найти зверинец может только Давид!"

[2eca88bcffa0]
en = "They say that only angels play their harps for their pets."
ru = "Говорят, только ангелы играют своим питомцам на арфах."

[a948644fb85b]
en = "They say that only big spenders carry gold."
ru = "Говорят, золото носят с собой только транжиры."

[2548db6db469]
en = "They say that orc shamans are healthy, wealthy and wise."
ru = "Говорят, орки-шаманы здоровы, богаты и мудры."

[2782f3801b7f]
en = "They say that playing NetHack is like walking into a death trap."
ru = "Говорят, играть в NetHack — всё равно что лезть в смертельную ловушку."
not_terms = ["death"]

[830a72415092]
en = "They say that problem breathing is best treated by a proper diet."
ru = "Говорят, проблемы с дыханием лучше всего лечить правильной диетой."

[cfadd26d8ac7]
en = "They say that quaffing many potions of levitation can give you a headache."
ru = "Говорят, если выпить много зелий левитации, может разболеться голова."

[4d17bb4e7302]
en = "They say that queen bees get that way by eating royal jelly."
ru = "Говорят, пчелиными матками становятся, поедая маточное молочко."

[657aabbef2a1]
en = "They say that reading a scare monster scroll is the same as saying Elbereth."
ru = "Говорят, прочитать свиток отпугивания монстров — всё равно что сказать Elbereth."

[3998d15926e7]
en = "They say that real hackers always are controlled."
ru = "Говорят, настоящие хакеры всегда под контролем."

[eedababaf250]
en = "They say that real hackers never sleep."
ru = "Говорят, настоящие хакеры никогда не спят."

[2ffa555c0195]
en = "They say that shopkeepers are insured by Croesus himself!"
ru = "Говорят, лавочники застрахованы у самого Крёза!"

[e8935823b706]
en = "They say that shopkeepers never carry more than 20 gold pieces, at night."
ru = "Говорят, ночью лавочники носят с собой не больше 20 золотых монет."

[cf32e8f16f83]
en = "They say that shopkeepers never sell blessed potions of invisibility."
ru = "Говорят, лавочники никогда не продают благословенные зелья невидимости."

[a0130d7955a2]
en = "They say that soldiers wear kid gloves and silly helmets."
ru = "Говорят, солдаты носят лайковые перчатки и дурацкие шлемы."

[e1ff03e7b795]
en = "They say that some Kops are on the take."
ru = "Говорят, некоторые копы берут взятки."

[c0701b0a0f08]
en = "They say that some guards' palms can be greased."
ru = "Говорят, некоторым стражам можно смазать лапу."

[91b00699363d]
en = "They say that some monsters may kiss your boots to stop your drum playing."
ru = "Говорят, некоторые монстры готовы целовать вам сапоги, лишь бы вы перестали барабанить."

[1aa1643f0778]
en = "They say that sometimes you can be the hit of the party when playing a horn."
ru = "Говорят, сыграв на роге, можно стать хитом вечеринки."

[7bdf4a55af25]
en = "They say that the NetHack gods generally welcome your sacrifices."
ru = "Говорят, боги NetHack обычно рады вашим жертвам."

[cab7e6ebc937]
en = "They say that the Three Rings are named Vilya, Nenya and Narya."
ru = "Говорят, Три Кольца зовутся Вилья, Ненья и Нарья."

[ea60ce8ccc2c]
en = "They say that the Wizard of Yendor has a death wish."
ru = "Говорят, Волшебник Йендора ищет смерти."

[a3c294be9e8e]
en = "They say that the `hair of the dog' is sometimes an effective remedy."
ru = "Говорят, `клин клином' порой отличное лекарство."
not_terms = ["dog"]

[3b4f650f3c08]
en = "They say that the best time to save your game is now before it's too late."
ru = "Говорят, лучшее время сохранить игру — сейчас, пока не поздно."

[fb6dfddbbfc8]
en = "They say that the biggest obstacle in NetHack is your mind."
ru = "Говорят, самое большое препятствие в NetHack — ваш собственный разум."

[9edc47e0f2b9]
en = "They say that the gods are angry when they hit you with objects."
ru = "Говорят, боги злятся, когда бросают в вас предметы."

[a27cb20bb78f]
en = "They say that the priesthood are specially favored by the gods."
ru = "Говорят, боги особенно благоволят жрецам."

[914c0c2b8a84]
en = "They say that the way to make a unicorn happy is to give it what it wants."
ru = "Говорят, чтобы порадовать единорога, дайте ему то, чего он хочет."

[58f910278e70]
en = "They say that there are no black or white stones, only gray."
ru = "Говорят, не бывает чёрных и белых камней, только серые."

[37a5565b76a2]
en = "They say that there are no skeletons hence there are no skeleton keys."
ru = "Говорят, скелетов не бывает, а значит, нет и универсальных ключей."

[927a8a6b0da5]
en = "They say that there is a clever rogue in every hacker just dying to escape."
ru = "Говорят, в каждом хакере сидит хитрый плут, который до смерти хочет вырваться на волю."

[38c185e578b2]
en = "They say that there is no such thing as free advice."
ru = "Говорят, бесплатных советов не бывает."

[0c9e02218841]
en = "They say that there is only one way to win at NetHack."
ru = "Говорят, выиграть в NetHack можно только одним способом."

[64987d47f538]
en = "They say that there once was a fearsome chaotic samurai named Luk No."
ru = "Говорят, жил когда-то грозный хаотичный самурай по имени Неуда Чи."

[f0834cba510f]
en = "They say that there was a time when cursed holy water wasn't water."
ru = "Говорят, было время, когда проклятая святая вода не была водой."

[66ad67f0a03e]
en = "They say that there's no point in crying over a gray ooze."
ru = "Говорят, над серой слизью слёз не льют."

[dc7f36f265fc]
en = "They say that trap doors should always be marked `Caution:  Trap Door'."
ru = "Говорят, на люках всегда должна быть надпись `Осторожно: люк'."

[80661bf7f585]
en = "They say that using an amulet of change isn't a difficult operation."
ru = "Говорят, воспользоваться амулетом перемены — несложная операция."

[d9010c1081f1]
en = "They say that water walking boots are better if you are fast like Hermes."
ru = "Говорят, сапоги водохождения лучше, если вы быстры, как Гермес."

[5d2bbf456dff]
en = "They say that when you wear a circular amulet you might resemble a troll."
ru = "Говорят, надев круглый амулет, можно стать похожим на тролля."

[4ae1671bc054]
en = "They say that when you're hungry you can get a pizza in 30 moves or it's free."
ru = "Говорят, если проголодаетесь, пиццу доставят за 30 ходов, а иначе — бесплатно."

[83d51dbd826b]
en = "They say that when your god is angry you should try another one."
ru = "Говорят, если ваш бог гневается, попробуйте другого."

[0a13f78bcc84]
en = "They say that wielding a unicorn horn takes strength."
ru = "Говорят, чтобы орудовать рогом единорога, нужна сила."

[ea38298cba4a]
en = "They say that with speed boots you never worry about hit and run accidents."
ru = "Говорят, в сапогах-скороходах можно бить и убегать без забот."

[fce55d090d07]
en = "They say that you can defeat a killer bee with a unicorn horn."
ru = "Говорят, пчелу-убийцу можно одолеть рогом единорога."

[469d17f21c2f]
en = "They say that you can only cross the River Styx in Charon's boat."
ru = "Говорят, Стикс можно пересечь только в лодке Харона."

[b4bf47812920]
en = "They say that you can only kill a lich once and then you'd better be careful."
ru = "Говорят, лича можно убить только однажды, а потом лучше быть начеку."

[216438cc954f]
en = "They say that you can only wish for things you've already had."
ru = "Говорят, пожелать можно только то, что у вас уже было."

[f2e5fed54301]
en = "They say that you can train a cat by talking gently to it."
ru = "Говорят, кошку можно приручить, ласково с ней разговаривая."

[b405c9af6c70]
en = "They say that you can train a dog by talking firmly to it."
ru = "Говорят, собаку можно выдрессировать, строго с ней разговаривая."

[92021ef183e3]
en = "They say that you can trust your gold with the king."
ru = "Говорят, своё золото можно доверить королю."

[28b62cec895a]
en = "They say that you can't wipe your greasy bare hands on a blank scroll."
ru = "Говорят, жирные руки о чистый свиток не вытрешь."

[a35225ce0041]
en = "They say that you cannot trust scrolls of rumor."
ru = "Говорят, свиткам слухов верить нельзя."

[9d9a9f97d88e]
en = "They say that you could fall head over heels for an energy vortex."
ru = "Говорят, в энергетический вихрь можно влюбиться по уши."

[9582dc1c3db0]
en = "They say that you need a key in order to open locked doors."
ru = "Говорят, чтобы открыть запертую дверь, нужен ключ."

[da7e29682621]
en = "They say that you need a mirror to notice a mimic in an antique shop."
ru = "Говорят, чтобы заметить мимика в антикварной лавке, нужно зеркало."

[94a12b9dba22]
en = "They say that you really can use a pick-axe unless you really can't."
ru = "Говорят, кирку вы действительно можете применить, если только действительно не можете."

[9df4344d1edf]
en = "They say that you should always store your tools in the cellar."
ru = "Говорят, инструменты всегда стоит хранить в подвале."

[16a14f006711]
en = "They say that you should be careful while climbing the ladder to success."
ru = "Говорят, по лестнице успеха надо подниматься осторожно."

[a441576f4450]
en = "They say that you should call your armor `rustproof'."
ru = "Говорят, свои доспехи стоит назвать `нержавеющими'."

[ae43b7721263]
en = "They say that you should name your dog Spuds to have a cool pet."
ru = "Говорят, назовите собаку Спадс — и питомец будет что надо."

[72bd0eb110d3]
en = "They say that you should name your weapon after your first monster kill."
ru = "Говорят, оружие стоит назвать в честь первого убитого монстра."

[d100155ac4c1]
en = "They say that you should never introduce a rope golem to a succubus."
ru = "Говорят, никогда не знакомьте верёвочного голема с суккубом."

[7557ddc01be8]
en = "They say that you should never sleep near invisible ring wraiths."
ru = "Говорят, никогда не спите рядом с невидимыми кольценосными призраками."

[747fb30e7cf7]
en = "They say that you should never try to leave the dungeon with a bag of gems."
ru = "Говорят, никогда не пытайтесь покинуть подземелье с мешком самоцветов."

[2d1f77456294]
en = "They say that you should remove your armor before sitting on a throne."
ru = "Говорят, прежде чем сесть на трон, снимите доспехи."

[940c88e23a9b]
en = "[cookie] This fortune cookie is copy protected."
ru = "Это печенье с предсказанием защищено от копирования."

[b19c792f2759]
en = "[cookie] This fortune cookie is the property of Fortune Cookies, Inc."
ru = "Это печенье с предсказанием — собственность ООО «Печенье с предсказаниями»."

[8dc9109be48d]
en = "This release contains 10%% recycled material."
ru = "Эта версия на 10% состоит из переработанных материалов."

[594e0351e0e8]
en = "Time stands still as the succubus changes her calendar to January 1, 2000."
ru = "Время замирает: суккуб переворачивает календарь на 1 января 2000 года."

[ad930240ebe7]
en = "Tired?  Try a scroll of charging on yourself."
ru = "Устали?  Прочитайте на себя свиток подзарядки."

[3dc9d0512347]
en = "To achieve the next higher rating, you need 3 more points."
ru = "Чтобы подняться в рейтинге, вам нужно ещё 3 очка."

[7db469ed4cd9]
en = "To reach heaven, escape the dungeon while wearing a ring of levitation."
ru = "Чтобы попасть на небеса, покиньте подземелье в кольце левитации."

[cac398eedd31]
en = "Tourists wear shirts loud enough to wake the dead."
ru = "Туристы носят такие кричащие рубашки, что мёртвые просыпаются."

[2530d8dd6953]
en = "Try calling your katana Moulinette."
ru = "Попробуйте назвать свою катану Мулинетт."

[0235c096e70a]
en = "Ulch!  That meat was painted!"
ru = "Тьфу!  Это мясо было крашеное!"

[1aaadeb6bc3e]
en = "Unfortunately, this message was left intentionally blank."
ru = "К сожалению, это сообщение намеренно оставлено пустым."

[a73e19a38f2b]
en = "Using a morning star in the evening has no effect."
ru = "Моргенштерн вечером не действует."

[88c022dbe34a]
en = "Waltz, dumb nymph, for quick jigs vex."
ru = "Съешь же ещё этих мягких французских булок, нимфа, да выпей чаю."

[1ea28c4ed96c]
en = "Want a hint?  Zap a wand of make invisible on your weapon!"
ru = "Хотите подсказку?  Наведите палочку невидимости на своё оружие!"

[ada06f4a0bfa]
en = "Want to ascend in a hurry?  Apply at Gizmonic Institute."
ru = "Хотите вознестись побыстрее?  Обращайтесь в Гизмонический институт."

[15a35d2326fb]
en = "Wanted: shopkeepers.  Send a scroll of mail to Mage of Yendor/Level 35/Dungeon."
ru = "Требуются лавочники.  Присылайте почтовый свиток по адресу: Архимаг Йендора/Уровень 35/Подземелье."

[b0d914b07d32]
en = "[cookie] Warning:  fortune reading can be hazardous to your health."
ru = "Минздрав предупреждает: чтение предсказаний опасно для вашего здоровья."

[05aa7b4a833f]
en = "We have new ways of detecting treachery..."
ru = "У нас есть новые способы распознавать предательство..."

[05154f30ca60]
en = "Wet towels make great weapons!"
ru = "Мокрое полотенце — отличное оружие!"

[f739c28034e5]
en = "[cookie] What a pity, you cannot read it!"
ru = "Какая жалость, вы не можете это прочесть!"

[7b6861593015]
en = "Whatever can go wrong, will go wrong."
ru = "Если что-то может пойти не так, оно пойдёт не так."

[24e8ddfdacd8]
en = "When a piercer drops in on you, you will be tempted to hit the ceiling!"
ru = "Когда на вас свалится пронзатель, вам захочется лезть на потолок!"

[e9f3bbb83814]
en = "When in a maze follow the right wall and you will never get lost."
ru = "В лабиринте держитесь правой стены — и никогда не заблудитесь."

[8430e6ab1f14]
en = "When you have a key, you don't have to wait for the guard."
ru = "Если у вас есть ключ, стража можно не ждать."

[3fdae60303ad]
en = "[cookie] Why are you wasting time reading fortunes?"
ru = "Зачем вы тратите время на чтение предсказаний?"

