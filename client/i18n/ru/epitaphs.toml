[3ac5889b265f]
en = "Here lies my wife: Here let her lie! Now she's at rest and so am I."
ru = "Здесь лежит моя жена: пусть лежит! Теперь покой у неё — и у меня."

[4fc861dd7a07]
en = "Here lies Johnny Yeast.  Pardon me for not rising."
ru = "Здесь лежит Джонни Дрожжин.  Простите, что не поднимаюсь."

[332325acfa32]
