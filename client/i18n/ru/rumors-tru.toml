en = "Rays aren't boomerangs, of course, but still..."
ru = "Лучи, конечно, не бумеранги, но всё же..."

[173c200c0c87]
en = "Read the manual before entering the cave -- you might get killed otherwise."
ru = "Прочтите инструкцию, прежде чем лезть в пещеру, — иначе можете погибнуть."

[127f2413ecf1]
en = "Reading Herbert might be enlightening in one case."
ru = "Чтение Герберта кое в чём просвещает."

[f487709e1040]
en = "Reading Tolkien might help you."
ru = "Почитайте Толкина — пригодится."

[6da6cfc27443]
en = "Reading scrolls after drinking booze can give confusing results."
ru = "После выпивки чтение свитков даёт путаные результаты."

[7c8987a1792a]
en = "Riding a dragon can be an uplifting experience."
ru = "Езда верхом на драконе — занятие возвышенное."

[2752830ea386]
en = "Rust monsters love water.  There are potions they hate, however."
ru = "Ржавники обожают воду.  Но есть зелья, которых они терпеть не могут."

[0fd690279cf8]
en = "Sacks protect contents from temperatures up to 452 degrees fahrenheit."
ru = "Мешки защищают содержимое при температуре до 452 градусов по Фаренгейту."

[2249cae5f24a]
en = "Scrolls fading?  It's not the heat, it's the humidity."
ru = "Свитки выцветают?  Дело не в жаре, а во влажности."

[b844d62a94f2]
en = "Shopkeepers accept credit cards, as long as you pay cash."
ru = "Лавочники принимают кредитные карты — при условии, что вы платите наличными."

[667ea662826d]
en = "Shopkeepers can spot a tourist a mile away with those Hawaiian shirts."
ru = "В этих гавайских рубашках лавочник узнаёт туриста за версту."

[3a7ea11d6351]
en = "Shopkeepers can't tell identical twins apart."
ru = "Лавочники не различают однояйцевых близнецов."

[169b8bcce0df]
en = "Shopkeepers don't read, so what use is engraving in a shop?"
ru = "Лавочники не читают — так какой смысл писать на полу в лавке?"

[59622d6305b4]
en = "Shopkeepers have incredible patience."
ru = "Терпение у лавочников невероятное."

[3f41d7f05ae4]
en = "Shopkeepers might raise their prices for tourists."
ru = "Для туристов лавочники могут и цены поднять."

[bcadcd8e4e7d]
en = "Shopkeepers value money more than revenge."
ru = "Деньги лавочник ценит выше мести."

[1b670ff0dcb8]
en = "Some monsters can be tamed.  I once saw a hacker with a tame dragon!"
ru = "Некоторых монстров можно приручить.  Я как-то видел хакера с ручным драконом!"

[bcd70e332830]
en = "Some remain flexible, while others can't seem to change their tune."
ru = "Одни гибки, а другие никак не сменят пластинку."

[9214f640ba9e]
en = "Someone once said that what goes up < might come down >."
ru = "Кто-то однажды сказал, что поднявшийся < может и спуститься >."

[357165a4005e]
en = "Someone's been spiking the pits!"
ru = "Кто-то натыкал кольев в ямы!"

[195ccffb2ccf]
en = "Sometimes monsters are more likely to fight each other than attack you."
ru = "Иногда монстры охотнее дерутся друг с другом, чем нападают на вас."

[a3c20d660d20]
en = "Spinach, carrot, and jelly -- a meal fit for a nurse!"
ru = "Шпинат, морковь и желе — обед, достойный медсестры!"

[951be2de5825]
en = "Surviving the full extent of the mines could mean that your luck is changing."
ru = "Если вы прошли копи до самого дна, удача, возможно, повернулась к вам лицом."

[6e7b83630a86]
en = "Tainted meat is even more sickening than poison!"
ru = "Тухлое мясо ещё тошнотворнее яда!"

[3b8b2bbd9663]
en = "Take your healing potions to the next level!"
ru = "Поднимите свои зелья лечения на новый уровень!"

[529150b37030]
en = "Telepathy is just a trick:  once you know how to do it, it's easy."
ru = "Телепатия — просто фокус: стоит понять, как это делается, и всё легко."

[42a452a5da9d]
en = "The Leprechaun Gold Tru$t is no division of the Magic Memory Vault."
ru = "«Золотой Тра$т Лепреконов» не имеет отношения к «Волшебному Хранилищу Памяти»."

[75b6b67ad22c]
en = "The Wizard finds death to be quite an experience."
ru = "Для Волшебника смерть — то ещё приключение."
not_terms = ["death"]

[0d2fdb7c277e]
en = "The best equipment for your work is, of course, the most expensive."
ru = "Лучшее снаряжение для вашего дела — разумеется, самое дорогое."

[c428a58671a0]
en = "The gods don't appreciate pesky priesthood."
ru = "Богам не по душе назойливые жрецы."

[284658c9111c]
en = "The gods will get angry if you kill your dog."
ru = "Боги разгневаются, если вы убьёте свою собаку."

[e44ee0192478]
en = "The less magic in your armor, the more you can add."
ru = "Чем меньше магии в доспехах, тем больше её можно добавить."

[42cc2860235d]
en = "The magic marker is mightier than the sword."
ru = "Что написано волшебным маркером, того не вырубишь и мечом."

[95cf17774717]
en = "The moon is not the only heavenly body to influence this game."
ru = "Луна — не единственное небесное тело, что влияет на эту игру."

[1976d47b9502]
en = "The orc swings his orcish broadsword named Elfrist at you.  You die..."
ru = "Орк замахивается на вас своим орочьим палашом по имени Эльфрист.  Вы умираете..."

[263ab21dad57]
en = "The secret of wands of Nothing Happens:  try again!"
ru = "Секрет палочек «Ничего не происходит»: попробуйте ещё раз!"

[7c710e8711dd]
en = "There has always been something mystical about mirrors."
ru = "В зеркалах всегда было что-то мистическое."

[27428c23135d]
en = "There is a big treasure hidden in the zoo!"
ru = "В зверинце спрятано большое сокровище!"

[ddb31e99eb68]
en = "There is more magic in this cave than meets the eye."
ru = "В этой пещере больше магии, чем кажется на первый взгляд."

[193505c8dc70]
en = "There is no harm in praising a large dog."
ru = "Похвалить большую собаку не вредно."

[95f4c281a9fe]
en = "There is nothing like eating a mimic."
ru = "Ничто не сравнится с поеданием мимика."

[9919c992be2d]
en = "There once was a Knight named Lancelot who liked to ride with his lance a lot."
ru = "Жил-был рыцарь по имени Ланселот: с рыцарским копьём он скакал круглый год."

[e446429f673b]
en = "They say a gelatinous cube can paralyze you..."
ru = "Говорят, студенистый куб может вас парализовать..."

[20e28cc2b651]
en = "They say that Juiblex is somewhat afraid of a wand of digging."
ru = "Говорят, Джубилекс побаивается палочки копания."

[19315a452ce6]
en = "They say that Medusa would like to put you on a pedestal."
ru = "Говорят, Медуза хотела бы возвести вас на пьедестал."

[941e0038abc2]
en = "They say that Vlad lives!!! ... near the mazes."
ru = "Говорят, Влад жив!!! ...где-то возле лабиринтов."

[c5cc1e145203]
en = "They say that 'Elbereth' is often written about."
ru = "Говорят, 'Elbereth' пишут где попало."

[8b962c35a4d2]
en = "They say that a bag of holding can't hold everything."
ru = "Говорят, сумка хранения не вместит всего."

[42df6b8c0d29]
en = "They say that a blessed tin of quasit meat is a quick meal."
ru = "Говорят, благословенная банка мяса квазита — быстрый обед."

[bf20e570f93c]
en = "They say that a cat avoids traps."
ru = "Говорят, кошки обходят ловушки."

[705c8c655831]
en = "They say that a cave spider will occasionally eat cave spider eggs."
ru = "Говорят, пещерный паук порой ест яйца пещерных пауков."

[da9dfe897981]
en = "They say that a clever wizard can have stats:  18/** 24 18 24 24 24."
ru = "Говорят, у умного волшебника характеристики могут быть такие: 18/** 24 18 24 24 24."

[e0a0b681109e]
en = "They say that a clove of garlic makes a good talisman if handled right."
ru = "Говорят, зубчик чеснока — хороший талисман, если правильно с ним обращаться."

[a441c70777a8]
en = "They say that a cursed scroll of teleportation could land you in trouble."
ru = "Говорят, проклятый свиток телепортации может забросить вас в беду."

[424392061f7f]
en = "They say that a diamond is another kind of luck stone."
ru = "Говорят, алмаз — это тоже своего рода камень удачи."

[d9278e84dff4]
en = "They say that a dog can be trained to fetch objects."
ru = "Говорят, собаку можно научить приносить вещи."

[6f382dadde98]
en = "They say that a gelatinous cube makes a healthy breakfast."
ru = "Говорят, студенистый куб — здоровый завтрак."

[982552d8aca8]
en = "They say that a giant gets strong by eating right, try it!"
ru = "Говорят, великан становится сильным, потому что правильно питается.  Попробуйте!"

[29b07de603bb]
en = "They say that a grid bug won't hit you when you cross it."
ru = "Говорят, ситовый жучок вас не тронет, если зайти к нему по диагонали."

[ad45d328bea1]
en = "They say that a lembas wafer is a very light snack."
ru = "Говорят, лембас — очень лёгкая закуска."

[7ae3240f7bdd]
en = "They say that a loadstone has a strange attraction and is not bad luck."
ru = "Говорят, у магнитного камня странная притягательность, а неудачи он не приносит."

[807caf3fd86a]
en = "They say that a lock pick by any other name is still a lock pick."
ru = "Говорят, отмычка остаётся отмычкой, как её ни назови."

[ce6945e08873]
en = "They say that a lucky amulet will block poisoned arrows."
ru = "Говорят, счастливый амулет отражает отравленные стрелы."

[8b3ae31a4e4f]
en = "They say that a mirror will freeze a floating eye but you can still see it."
ru = "Говорят, зеркало парализует парящее око, а вы при этом останетесь зрячим."

[0a903e628809]
en = "They say that a neutral character might get Giantslayer."
ru = "Говорят, нейтральный герой может получить Великаноборца."

[c26df7b512d1]
en = "They say that a polymorph trap is magic and magic protection prevents it."
ru = "Говорят, ловушка превращения — это магия, и защита от магии от неё спасает."

[76c9f0f3febd]
en = "They say that a potion of healing can cancel a potion of sickness."
ru = "Говорят, зелье лечения может нейтрализовать зелье болезни."

[15647de9f233]
en = "They say that a potion of monster detection sometimes works both ways."
ru = "Говорят, зелье обнаружения монстров порой действует в обе стороны."

[27897929d973]
en = "They say that a sink looks different from high above the floor."
ru = "Говорят, сверху раковина выглядит иначе."

[95c66383a796]
en = "They say that a summoned demon could improve your game."
ru = "Говорят, вызванный демон может улучшить вашу игру."

[5de454171e99]
en = "They say that a tin of wraith meat is a rare dining experience."
ru = "Говорят, банка мяса призрака — редкое гастрономическое впечатление."

[ec8d07912b46]
en = "They say that a unicorn might bring you luck."
ru = "Говорят, единорог может принести вам удачу."

[f699438cea02]
en = "They say that a wand of cancellation is like a wand of polymorph."
ru = "Говорят, палочка отмены похожа на палочку превращения."

[bd8a386991b8]
en = "They say that a wand of locking can close more than just doors."
ru = "Говорят, палочка запирания закрывает не только двери."

[51acac2b69c8]
en = "They say that a wand of polymorph can change your game."
ru = "Говорят, палочка превращения может изменить вашу игру."

[c776f685fb2f]
en = "They say that a wise choice of donations lets you choose your blessings."
ru = "Говорят, мудро выбранное пожертвование позволяет выбрать и благословение."

[84004e527b30]
en = "They say that a wizard is even more powerful the second time around."
ru = "Говорят, во второй раз волшебник ещё сильнее."

[5006ed928213]
en = "They say that a xorn knows of no obstacles when pursuing you."
ru = "Говорят, ксорн, преследуя вас, не знает преград."

[1d7dfe3671d3]
en = "They say that abusing a credit card could shock you sooner or later."
ru = "Говорят, злоупотребление кредитной картой рано или поздно вас шокирует."

[dcfdf2a08d4a]
en = "They say that amulets, like most things, can be deadly or life saving."
ru = "Говорят, амулеты, как и многое другое, могут и убить, и спасти жизнь."

[4706bad98ef9]
en = "They say that an altar can identify blessings."
ru = "Говорят, алтарь распознаёт благословения."

[16de6b136970]
en = "They say that an ooze will bite your boots and a rock mole might eat them."
ru = "Говорят, слизь разъест вам сапоги, а каменный крот может их съесть."

[8325b08e9766]
en = "They say that an unlucky hacker was once killed by an exploding tin."
ru = "Говорят, одного невезучего хакера убила взорвавшаяся банка."

[c80c77a6a406]
en = "They say that antique dealers are always interested in precious stones."
ru = "Говорят, антиквары всегда интересуются драгоценными камнями."

[1af7c0853e50]
en = "They say that bandaging one's wounds helps to keep up one's appearance."
ru = "Говорят, перевязанные раны помогают сохранять приличный вид."

[e55055fba42e]
en = "They say that booze can be diluted but not cancelled."
ru = "Говорят, выпивку можно разбавить, но не отменить."

[e3b0d411c2dd]
en = "They say that by listening carefully, you can hear a secret door!"
ru = "Говорят, если хорошенько прислушаться, можно услышать потайную дверь!"

[7cb63b203f0f]
en = "They say that carrots and carrot juice may improve your vision."
ru = "Говорят, морковь и морковный сок улучшают зрение."

[0b59de078e4f]
en = "They say that cave spiders are not considered expensive health food."
ru = "Говорят, пещерных пауков не считают дорогой диетической едой."

[a304ada4b1fc]
en = "They say that demigods must leave behind their prized earthly possessions."
ru = "Говорят, полубогам приходится оставлять свои драгоценные земные пожитки."

[ed74a37c38bd]
en = "They say that disturbing a djinni can be a costly mistake."
ru = "Говорят, потревожить джинна — дорогостоящая ошибка."

[c2b4c52f04b4]
en = "They say that dragon scales can be quite enchanting."
ru = "Говорят, драконья чешуя бывает очаровательна, особенно если её зачаровать."

[8b87ae8ca4c6]
en = "They say that dropping coins into a fountain will not grant you a wish."
ru = "Говорят, монетка, брошенная в фонтан, желания не исполнит."

[1c1f040c0d79]
en = "They say that dwarves lawfully mind their own business."
ru = "Говорят, дварфы законопослушно занимаются своими делами."

[0b2a5a49bc57]
en = "They say that eating a bat corpse will make you batty, for a while."
ru = "Говорят, от трупа летучей мыши у вас на время поедет крыша."

[d597c407db41]
en = "They say that eating a cram ration is a smart move."
ru = "Говорят, съесть концентрированный паёк — умный ход."

[21a11bdd33a4]
en = "They say that eating blue jelly is cool if you don't fight the feeling."
ru = "Говорят, синий студень освежает, если не бороться с ощущением."

[4602f838030f]
en = "They say that elven armor can hold the most magic."
ru = "Говорят, эльфийские доспехи вмещают больше всего магии."

[1355f3c159b1]
en = "They say that escaping a dungeon is only the beginning of the end."
ru = "Говорят, выбраться из подземелья — это только начало конца."

[98a822b5e28a]
en = "They say that feeling an unexpected draft of air is sort of a breakthrough."
ru = "Говорят, неожиданный сквозняк — своего рода прорыв."

[beafd8c713b5]
en = "They say that finding a cursed gray stone is always bad luck."
ru = "Говорят, найти проклятый серый камень — всегда к неудаче."

[ff84757fb4e4]
en = "They say that gaining a level is an experience that can raise your sights."
ru = "Говорят, новый уровень — это опыт, который расширяет горизонты."

[006baac6a891]
en = "They say that garter snake meat may not taste good but it's still healthy."
ru = "Говорят, мясо подвязочной змеи невкусное, но полезное."

[5cd27e820242]
en = "They say that gauntlets of dexterity have a hidden enchanted touch."
ru = "Говорят, у перчаток ловкости есть скрытое волшебное прикосновение."

[ec03706984b7]
en = "They say that going to heaven is just another way of escaping the dungeon."
ru = "Говорят, попасть на небеса — всего лишь ещё один способ выбраться из подземелья."

[82c68266c8ce]
en = "They say that golden nagas are law-abiding denizens as long as you are too."
ru = "Говорят, золотые наги законопослушны — пока законопослушны вы."

[5602a847d155]
en = "They say that gremlins can make you feel cooler than you are now."
ru = "Говорят, после гремлинов вам может стать прохладнее."

[6cd4905b776a]
en = "They say that grid bugs only exist in a strictly Cartesian sense."
ru = "Говорят, ситовые жучки существуют лишь в строго декартовом смысле."

[688aa68b4c19]
en = "They say that hackers often feel jumpy about eating nymphs."
ru = "Говорят, от поедания нимф хакеров начинает бросать из стороны в сторону."

[1ac6d407b6d0]
en = "They say that having polymorph control won't shock you."
ru = "Говорят, контроль превращений убережёт вас от шока."

[0deef66f480a]
en = "They say that healing potions often come in pairs."
ru = "Говорят, зелья лечения часто встречаются парами."

[af63eca53ba9]
en = "They say that if it's hard getting your food down another bite could kill."
ru = "Говорят, если еда уже в горло не лезет, ещё один кусок может убить."

[71fada740c63]
en = "They say that if you don't wear glasses why bother with carrots?"
ru = "Говорят, если вы не носите очков, зачем вам морковь?"

[8655043af27f]
en = "They say that if you notice a loose board beneath you, don't step on it."
ru = "Говорят, если заметили под ногами шаткую доску, не наступайте на неё."

[3993b6b6db1b]
en = "They say that if you start at the bottom the only place to go is up."
ru = "Говорят, если начинаешь с самого дна, дорога одна — наверх."

[220921b1e752]
en = "They say that if you teleport to heaven you're presumed to be dead already."
ru = "Говорят, кто телепортировался на небеса, считается уже мёртвым."

[5068ffe8d626]
en = "They say that in a shop you can be charged for old charges."
ru = "Говорят, в лавке с вас могут взять плату за старые заряды."

[5d416424a22b]
en = "They say that in lighter moments you could think of ways to pass a stone."
ru = "Говорят, в минуты лёгкости можно придумать, как избавиться от камня."

[a8e04bac0900]
en = "They say that in the dungeon breaking a mirror can be seven years bad luck."
ru = "Говорят, разбитое в подземелье зеркало сулит семь лет неудач."

[00f828c0428a]
en = "They say that in the dungeon you don't usually have any luck at all."
ru = "Говорят, в подземелье удачи обычно нет вовсе."

[83b5548b7990]
en = "They say that in time a blessed luckstone can make your god happy."
ru = "Говорят, со временем благословенный камень удачи может порадовать вашего бога."

[a3fa11e7114f]
en = "They say that it is easier to kill the Wizard than to make him stand still."
ru = "Говорят, Волшебника легче убить, чем заставить стоять на месте."

[921ed46390f8]
en = "They say that it only takes 1 zorkmid to meet the Kops."
ru = "Говорят, чтобы встретиться с кистоунскими копами, хватит и одного зоркмида."

[b72828dc3987]
en = "They say that it's a blast when you mix the right potions together."
ru = "Говорят, если смешать правильные зелья, будет просто взрыв."

[dab4fe87fb0f]
en = "They say that it's not blind luck if you catch a glimpse of Medusa."
ru = "Говорят, уцелеть при виде Медузы — это не слепая удача, а удача слепого."

[cbbc483d372e]
en = "They say that killing a shopkeeper brings bad luck."
ru = "Говорят, убийство лавочника приносит неудачу."

[441a926bf7f6]
en = "They say that monsters never step on a scare monster scroll."
ru = "Говорят, монстры никогда не наступают на свиток отпугивания монстров."

[50a7ceda9c29]
en = "They say that most monsters find flute recitals extremely boring."
ru = "Говорят, на концертах флейты большинство монстров засыпает со скуки."

[06c872001cb3]
en = "They say that mummy corpses are not well preserved."
ru = "Говорят, трупы мумий плохо сохраняются."

[da45c0c0c309]
en = "They say that naturally a wand of wishing would be heavily guarded."
ru = "Говорят, палочку желаний, разумеется, хорошо охраняют."

[d11868ae687c]
en = "They say that no one notices the junk underneath a boulder."
ru = "Говорят, хлама под валуном никто не замечает."

[6d1173324a15]
en = "They say that nobody expects a unicorn horn to rust."
ru = "Говорят, никто не ожидает, что рог единорога заржавеет."

[c206afee7a17]
en = "They say that nobody knows if an explorer can live forever.  Do you?"
ru = "Говорят, никто не знает, может ли исследователь жить вечно.  А вы знаете?"

[c1608c0cdcb9]
en = "They say that nothing can change the fact that some potions contain a djinni."
ru = "Говорят, ничто не изменит того, что в некоторых зельях сидит джинн."

[bb96c072abfe]
en = "They say that nothing can change the fact that some potions contain a ghost."
ru = "Говорят, ничто не изменит того, что в некоторых зельях сидит привидение."

[7cab0f4b295f]
en = "They say that nymphs always fall for rock'n'roll, try it!"
ru = "Говорят, нимфы всегда западают на рок-н-ролл.  Попробуйте!"
not_terms = ["rock"]

[90272f048a8d]
en = "They say that once an Olog-Hai is canned it never shows its face again."
ru = "Говорят, олог-хай, попав в консервную банку, больше никогда не показывается."

[e0d2a5b8d5a6]
en = "They say that once upon a time xans would never scratch your boots."
ru = "Говорят, когда-то ксаны никогда не царапали вам сапоги."

[0d0784253ec0]
en = "They say that only an experienced wizard can do the tengu shuffle."
ru = "Говорят, только опытный волшебник освоит пляску тэнгу."

[61e4bac723dd]
en = "They say that only chaotics can kill shopkeepers and get away with it."
ru = "Говорят, только хаотичным героям сходит с рук убийство лавочников."

[7cb8c71e2274]
en = "They say that only female monsters can lay eggs."
ru = "Говорят, откладывать яйца могут только самки монстров."

[0c4364756adb]
en = "They say that playing a horn really bad is really good."
ru = "Говорят, если очень плохо играть на роге, это очень хорошо."

[26e15a0967e5]
en = "They say that prayer at an altar can sometimes make the water there holy."
ru = "Говорят, молитва у алтаря порой делает воду на нём святой."

[080051e1f9f8]
en = "They say that the right wand may help you chase a nymph."
ru = "Говорят, подходящая палочка поможет вам догнать нимфу."

[0741ea7669cd]
en = "They say that rubbing a glowing potion does not make it a magic lamp."
ru = "Говорят, если потереть светящееся зелье, волшебной лампой оно не станет."

[3d00a2121c11]
en = "They say that scalpels become dull because they're not athames."
ru = "Говорят, скальпели тупятся, потому что они не атамы."

[346f4ae88939]
en = "They say that shopkeepers don't like pick-axes."
ru = "Говорят, лавочники не любят кирки."

[d6e630556f2f]
en = "They say that shopkeepers don't mind you bringing your pets in the shop."
ru = "Говорят, лавочники не возражают, если вы приводите в лавку питомцев."

[3adf1cfac13d]
en = "They say that shopkeepers don't usually mind if you sneak into a shop."
ru = "Говорят, лавочники обычно не против, если вы прокрадётесь в лавку."

[dd46c869e627]
en = "They say that shopkeepers often have a large amount of money in their purses."
ru = "Говорят, в кошельках у лавочников обычно водятся большие деньги."

[6a220d14077f]
en = "They say that shopkeepers often remember things that you might forget."
ru = "Говорят, лавочники часто помнят то, что вы могли и забыть."

[6e4ac0912159]
en = "They say that sinks and armor don't mix, take your cloak off now!"
ru = "Говорят, раковины и доспехи несовместимы — снимите плащ немедленно!"

[b027c942e927]
en = "They say that sinks run hot and cold and many flavors in between."
ru = "Говорят, из раковины течёт горячая и холодная вода, а между ними — масса вкусов."

[cbcfbee447df]
en = "They say that sitting on a vampire's throne is worth the danger."
ru = "Говорят, посидеть на троне вампира стоит риска."

[7067b3fa3c78]
en = "They say that snake charmers aren't charismatic, just musical."
ru = "Говорят, заклинатели змей не обаятельны, а просто музыкальны."

[61fa0be76cf9]
en = "They say that soldiers are always prepared and usually protected."
ru = "Говорят, солдаты всегда готовы и обычно хорошо защищены."

[ee1780ee6785]
en = "They say that some eggs could hatch in your pack, lucky or not."
ru = "Говорят, некоторые яйца могут вылупиться прямо у вас в рюкзаке, к счастью или нет."

[845c928816f3]
en = "They say that some fire ants will make you a hot meal."
ru = "Говорят, огненные муравьи приготовят вам горячий обед."

[32fa117be9e5]
en = "They say that some horns play hot music and others are too cool for words."
ru = "Говорят, одни рога играют зажигательную музыку, а другие слишком холодны для слов."

[0779348d7ef7]
en = "They say that some humanoids are nonetheless quite human."
ru = "Говорят, некоторые гуманоиды всё-таки вполне люди."

[a99bddeba292]
en = "They say that some shopkeepers consider gems to be family heirlooms."
ru = "Говорят, некоторые лавочники считают самоцветы фамильными драгоценностями."

[74503417597d]
en = "They say that some shopkeepers recognize gems but they won't tell you."
ru = "Говорят, некоторые лавочники распознают самоцветы, но вам не скажут."

[183a9cb168da]
en = "They say that some stones are much much heavier than others."
ru = "Говорят, одни камни намного-намного тяжелее других."

[0f705f79028e]
en = "They say that some yetis are full of hot air."
ru = "Говорят, некоторые йети полны горячего воздуха."

[0dce81ce3f7a]
en = "They say that something very special would be in a well-protected place."
ru = "Говорят, что-то совсем особенное должно лежать в хорошо защищённом месте."

[e969defc29d5]
en = "They say that speed boots aren't fast enough to let you walk on water."
ru = "Говорят, даже сапоги-скороходы недостаточно быстры, чтобы бегать по воде."

[5e510e9242f9]
en = "They say that teleport traps are the devil's work."
ru = "Говорят, телепортационные ловушки — дело рук дьявола."

[e5cce6d9fd36]
en = "They say that tengu don't wear rings, why should you?"
ru = "Говорят, тэнгу не носят колец — а вам-то зачем?"

[17dcd9c57f9f]
en = "They say that tengu never steal gold although they would be good at it."
ru = "Говорят, тэнгу никогда не крадут золото, хотя у них бы получилось."

[2d2385e773c8]
en = "They say that that which was stolen once can be stolen again, ask any nymph."
ru = "Говорят, что украдено однажды, можно украсть и снова, — спросите любую нимфу."

[261c688ebd97]
en = "They say that the best way to fix your injuries is a potion."
ru = "Говорят, лучшее средство от ран — зелье."

[eb4f509cb0a5]
en = "They say that the Delphic Oracle knows that lizard corpses aren't confusing."
ru = "Говорят, Дельфийский Оракул знает, что трупы ящериц не сбивают с толку."

[c9efdfe545d4]
en = "They say that the Hand of Elbereth can hold up your prayers."
ru = "Говорят, Длань Elbereth может задержать ответ на ваши молитвы."

[c1ada5ed2802]
en = "They say that the Leprechaun King is rich as Croesus."
ru = "Говорят, Король лепреконов богат, как Крёз."

[e3c8f0e88c65]
en = "They say that the Wizard of Yendor is schizophrenic and suicidal."
ru = "Говорят, у Волшебника Йендора раздвоение личности и тяга к самоубийству."

[f239a3b00b9b]
en = "They say that the experienced character knows how to convert an altar."
ru = "Говорят, опытный герой знает, как обратить алтарь в свою веру."

[18cd2eabd7e7]
en = "They say that the gods are happy when they drop objects at your feet."
ru = "Говорят, боги довольны, когда роняют предметы к вашим ногам."

[97ecdb9ab65c]
en = "They say that the idea of invisible Nazgul has a certain ring to it."
ru = "Говорят, невидимые назгулы — идея, от которой так и веет Кольцом."

[88abd55060ad]
en = "They say that the lady of the lake now lives in a fountain somewhere."
ru = "Говорят, Владычица Озера теперь живёт где-то в фонтане."
not_terms = ["the lady"]

[f8aba2d3aa86]
en = "They say that the local shopkeeper frowns upon the rude tourist."
ru = "Говорят, здешний лавочник хмурится на грубых туристов."

[2720fac17bdc]
en = "They say that the only door to the vampire's tower is on its lowest level."
ru = "Говорят, единственная дверь в башню вампира — на её нижнем этаже."

[a128dc49d07c]
en = "They say that the only good djinni is a grateful djinni."
ru = "Говорят, хороший джинн — только благодарный джинн."

[454034502764]
en = "They say that the thing about genocide is that it works both ways."
ru = "Говорят, у геноцида есть одна особенность: он действует в обе стороны."

[ba9dbdadfe27]
en = "They say that the unicorn horn rule is if it ain't broke then don't fix it."
ru = "Говорят, у рога единорога правило простое: работает — не трогай."

[cb6fd698f8aa]
en = "They say that the view from a fog cloud is really very moving."
ru = "Говорят, вид изнутри туманного облака очень трогательный."

[8eef928f64ba]
en = "They say that the walls in shops are made of extra hard material."
ru = "Говорят, стены в лавках сделаны из особо прочного материала."

[4f0d993de65f]
en = "They say that there are at least 15 ways to lose a pair of levitation boots."
ru = "Говорят, есть по меньшей мере 15 способов лишиться сапог левитации."

[7d2a5fb975a9]
en = "They say that throwing glass gems is the same as throwing rocks."
ru = "Говорят, кидаться стекляшками — всё равно что кидаться камнями."

[dd35cd12a781]
en = "They say that to block a shocking sphere, you need the right shield."
ru = "Говорят, чтобы защититься от электрической сферы, нужен правильный щит."

[d15b8cff3952]
en = "They say that trespassing a boulder is probably beneath you."
ru = "Говорят, пролезать под валуном — ниже вашего достоинства."

[9722d93e1cf7]
en = "They say that true power comes from within...except when it doesn't."
ru = "Говорят, истинная сила идёт изнутри... кроме тех случаев, когда нет."

[16c065bc747a]
en = "They say that unicorns are fond of precious gems."
ru = "Говорят, единороги любят драгоценные камни."

[967665004ff6]
en = "They say that what goes down the drain might come back up."
ru = "Говорят, что ушло в слив, может и вернуться."

[3060128a8434]
en = "They say that wielded, a long sword named Fire Brand makes you feel cooler."
ru = "Говорят, длинный меч по имени Огненный Клинок в руке дарит прохладу."

[8ee94383f342]
en = "They say that wielded, a long sword named Frost Brand makes you hot stuff."
ru = "Говорят, длинный меч по имени Морозный Клинок в руке делает вас горячей штучкой."

[70ad70a91767]
en = "They say that wiping its face is impossible for a floating eye."
ru = "Говорят, парящее око никак не может вытереть лицо."

[1e5d08860113]
en = "They say that with a floating eye you could see in the dark."
ru = "Говорят, с парящим оком можно видеть в темноте."

[bc3512822de6]
en = "They say that you are lucky if you can get a unicorn to catch a ruby."
ru = "Говорят, если единорог поймает ваш рубин, вам повезло."

[94acc2ed9ae8]
en = "They say that you are what you eat."
ru = "Говорят, вы — то, что вы едите."

[3327d6a5246d]
en = "They say that you can find named weapons at an altar if you're lucky."
ru = "Говорят, если повезёт, у алтаря можно найти именное оружие."

[1a3f69536ba6]
en = "They say that you can give potions of extra healing new energy."
ru = "Говорят, зельям усиленного лечения можно придать новую силу."

[071c14746e82]
en = "They say that you can safely touch cockatrice eggs but why bother?"
ru = "Говорят, яйца василиска можно трогать без опаски, но зачем?"

[7821ca6b929e]
en = "They say that you can't break an amulet of reflection."
ru = "Говорят, амулет отражения не разбить."

[cf347c306f68]
en = "They say that you don't always get what you wish for."
ru = "Говорят, желаемое сбывается не всегда."

[9b8942a893aa]
en = "They say that you should always be prepared for a final challenge."
ru = "Говорят, к последнему испытанию надо быть готовым всегда."

[7c232b59b084]
en = "They say that you should ask a dwarf to let you into a locked shop."
ru = "Говорят, чтобы попасть в запертую лавку, попросите дварфа."

[3c129633384c]
en = "They say that you should pray for divine inspiration."
ru = "Говорят, о божественном вдохновении надо молиться."

[f10104ce3ec3]
en = "They say that you should religiously give your gold away."
ru = "Говорят, золото надо раздавать с религиозным рвением."

[34e9cdf91671]
en = "They say that you will never get healthy by eating geckos."
ru = "Говорят, поедая гекконов, здоровья не наберёшься."

[131caae0b2be]
en = "They say that zapping yourself with a wand of undead turning is stupid."
ru = "Говорят, направлять на себя палочку изгнания нежити глупо."

[e0856cabee1d]
en = "They say the Furies are more furious if you've been sinning."
ru = "Говорят, эринии свирепее, если вы грешили."

[0170b9310274]
en = "They say the Wizard's castle is booby-trapped!"
ru = "Говорят, замок Волшебника кишит ловушками!"

[7fd6aa799f68]
en = "They say the gods get angry if you kill your dog."
ru = "Говорят, боги гневаются, если вы убиваете свою собаку."

[d71349dc20ac]
en = "They say the gods get angry if you pray too much."
ru = "Говорят, боги гневаются, если слишком часто молиться."

[9dd4cd09c294]
en = "They say there is a powerful magic item hidden in a castle deep down!"
ru = "Говорят, глубоко внизу, в замке, спрятан могущественный волшебный предмет!"

[65913db4248c]
en = "Those who wield a cockatrice corpse have a rocky road ahead of them."
ru = "Кто держит в руках труп василиска, тому предстоит каменистый путь."

[c368c12d17a5]
en = "Throwing food at a wild dog might tame him."
ru = "Если бросить еду дикой собаке, её можно приручить."

[f1556e98da13]
en = "To a full belly all food is bad."
ru = "Сытому любая еда противна."

[f1cc8542b6e6]
en = "Trolls are described as rubbery:  they keep bouncing back."
ru = "Троллей называют резиновыми: они всё время возвращаются."

[31e9aa234a0b]
en = "Try the fall-back end-run play against ghosts."
ru = "Против привидений попробуйте обходной манёвр с отступлением."

[2e6ade308afa]
en = "Try using your magic marker on wet scrolls."
ru = "Попробуйте писать волшебным маркером на размокших свитках."

[3661abccfa3e]
en = "Two wrongs don't make a right, but three lefts do."
ru = "Два неверных поворота не дадут верного, а вот три левых дадут правый."

[90f81498003f]
en = "Unicorn horns can cleanse things other than yourself."
ru = "Рогом единорога можно очищать не только себя."

[c34eebe2021d]
en = "Valkyries come from the north, and have commensurate abilities."
ru = "Валькирии родом с севера, и способности у них соответствующие."

[d0e89a97f9d6]
en = "Vampires hate garlic."
ru = "Вампиры ненавидят чеснок."

[95873c978ef6]
en = "Vault guards never disturb their Lords."
ru = "Стражи хранилищ никогда не беспокоят своих Лордов."

[c5ac1d92e189]
en = "Vegetarians enjoy lichen and seaweed."
ru = "Вегетарианцы любят лишайник и водоросли."

[0a2e8cec180d]
en = "Visitors are requested not to apply genocide to shopkeepers."
ru = "Посетителей просят не применять геноцид к лавочникам."

[642b42c04f7d]
en = "Want to heal faster?  Dip your potions of healing in a potion of speed!"
ru = "Хотите лечиться быстрее?  Окуните зелья лечения в зелье скорости!"

[6497d1b21753]
en = "Watch out, the Wizard might come back."
ru = "Берегитесь: Волшебник может вернуться."

[64beabacd9ef]
en = "Water traps have no effect on dragons."
ru = "Водяные ловушки на драконов не действуют."

[1eb22f758e1d]
en = "What is a cockatrice going to eat when it gets hungry?"
ru = "Что станет есть василиск, когда проголодается?"

[82c2eac4f731]
en = "Who needs an apron if they're made of glass?"
ru = "Зачем фартук тому, кто сделан из стекла?"

[760af3515ba8]
en = "Why do you suppose they call them MAGIC markers?"
ru = "Как вы думаете, почему их называют ВОЛШЕБНЫМИ маркерами?"

[d6d99cdeea90]
en = "Why do you think they call them mercenaries?"
ru = "Как вы думаете, почему их называют наёмниками?"

[70efc98d684e]
en = "Why would anybody in his sane mind engrave \"Elbereth\"?"
ru = "Зачем человеку в здравом уме писать \"Elbereth\"?"

[d9b6ed4009bd]
en = "Wishing too much may bring you too little."
ru = "Кто желает слишком многого, может получить слишком мало."

[bb34df60978e]
en = "You can't bribe soldier ants."
ru = "Муравьёв-солдат не подкупишь."

[4ff099782d76]
en = "You can't leave a shop through the back door:  there isn't one!"
ru = "Из лавки не уйти через чёрный ход: его там нет!"

[b3bad735728d]
en = "You can't reflect explosions.  But you might resist them."
ru = "Взрыв не отразить.  Но устоять перед ним можно."

[fc9064e909bd]
en = "You may discover a fine spirit inside a potion bottle."
ru = "В бутылке из-под зелья может оказаться отменный дух."

[ad80e2818800]
en = "You may want to dip into a potion of bottled blessings."
ru = "Вам, пожалуй, стоит окунуть что-нибудь в зелье разлитых по бутылкам благословений."

[a16e86e5da6d]
en = "You might be able to bribe a demon lord."
ru = "Демона-лорда можно и подкупить."

[8eea77fbd1cd]
en = "You might trick a shopkeeper if you're invisible."
ru = "Невидимкой можно обмануть лавочника."

[736296ea74d7]
en = "You should certainly learn about quantum mechanics."
ru = "Вам определённо стоит изучить квантовую механику."
not_terms = ["quantum mechanic"]

[7a5b4374aeaf]
en = "You won't always get a second chance, even with life saving."
ru = "Второго шанса может и не быть, даже со спасением жизни."

[1627a5121e14]
en = "You're going into the morgue at midnight???"
ru = "Вы идёте в морг в полночь???"

[589ec0a60ab0]
en = "Your dog knows what to eat; maybe you should take lessons."
ru = "Ваша собака знает, что есть; может, вам стоит у неё поучиться."

